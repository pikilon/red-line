# Spec 26 Phase 1: prop feature types.
# `blocks: vehicles` stops vehicles and lets infantry through (spec 31 A7); crate-stack says `all`.
types:
  - id: crate-stack
    family: prop
    footprint: [1, 1]
    blocks: all
    variants: 2
    render: { model: crate-stack, color: "#8a6a3c", height: 0.7 }
