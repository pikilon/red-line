factions: [ukraine, russia, usa, china]          # required; file order of data/factions/<id>.yaml
features: [vegetation, buildings, props, port, bridges, earthworks]   # optional; file order of data/features/<id>.yaml (spec 26)
maps: [first-line, river-port, showcase, landscape-lab, demo-town, demo-forest, demo-ground, demo-coast, demo-bridges, demo-destruction, demo-cover, hostomel, irpin]       # required; file order of data/maps/<id>.yaml
ai: [ukraine-balanced, ukraine-rush, russia-balanced, russia-rush, usa-balanced, usa-rush, china-balanced, china-rush]   # required; file order of data/ai/<id>.yaml
# Spec 05 §9: AI difficulty levels, easiest first (Zero Hour's Easy / Medium / Hard armies, plus Brutal).
# medium must stay the AI as it played before difficulty levels. Tuned by bot-vs-bot runs (spec 05 §9.4).
aiDifficulties:
  - { id: easy, thinkTicks: 15, forcePercent: 100, triggerDelayPercent: 100, extraHarvesters: 0, incomePercent: 75, retreatHpPercent: 0, buildableForcesOnly: false }
  - { id: medium, thinkTicks: 15, forcePercent: 100, triggerDelayPercent: 100, extraHarvesters: 0, incomePercent: 100, retreatHpPercent: 0, buildableForcesOnly: false }
  - { id: hard, thinkTicks: 15, forcePercent: 100, triggerDelayPercent: 100, extraHarvesters: 1, incomePercent: 100, retreatHpPercent: 30, buildableForcesOnly: true }
  - { id: brutal, thinkTicks: 10, forcePercent: 100, triggerDelayPercent: 100, extraHarvesters: 2, incomePercent: 125, retreatHpPercent: 35, buildableForcesOnly: true }
saves: [showcase, showcase-units, armor-duel, infantry-vs-armor, rpg-ambush, artillery-range, force-fire-demo, defenses, base-assault, economy, low-power, production, rally-points, selling, building-repair, vehicle-repair, infantry-healing, construction, damaged-base, pathfinding-river, tank-through-group, crowd, gore, victory-near, ai-attack, run-over, vehicle-deaths, weapon-impacts, hills-and-cliffs, crater-crossing, crater-field, friendly-fire, tank-friendly-fire, audio-fight, landscape-lab, demo-town, demo-forest, demo-ground, demo-coast, demo-bridges, environment-destruction, environment-garrison, tech-capture, environment-cover, river-port, town-drones, infantry-transport, bridge-repair, trench-digging, trench-network, trench-assault, port-supply, amphibious-crossing, air-war, robots-vs-jammer, deep-strike, tutorial-ua-base, tutorial-ua-infantry, tutorial-ua-armor, tutorial-ua-drones, tutorial-ua-air-defense, tutorial-ru-base, tutorial-ru-infantry, tutorial-ru-armor, tutorial-ru-drones, tutorial-ru-air-defense, campaign-ru-01-hostomel, campaign-ru-02-snake-island, campaign-ru-03-mariupol, campaign-ru-04-bakhmut, campaign-ru-05-surovikin-line, campaign-ru-06-avdiivka, campaign-ru-07-kursk-pipe, campaign-ru-08-oreshnik, campaign-ru-09-kyiv, campaign-ru-10-narva, campaign-ua-01-hostomel, campaign-ua-02-irpin, campaign-ua-03-moskva, campaign-ua-04-snake-island, campaign-ua-05-kharkiv, campaign-ua-06-nord-stream, campaign-ua-07-kursk, campaign-ua-08-spiderweb, campaign-ua-09-long-arm, campaign-ua-10-moscow, veterancy, upgrades, generals-powers, stealth, superweapons]   # optional; menu order of data/saves/<id>.yaml|json (spec 19 §4)
damageTypes: [smallArms, autocannon, antiTank, highExplosive, thermobaric, flak]   # required, ids (spec 43: flak is last)
armorClasses: [infantry, light, armored, structure, drone, aircraft]               # required, ids (spec 43: drone, aircraft are last)
damageModifiers:                     # required: one entry per damage type, one key per armour class, 0..1000
  smallArms: { infantry: 100, light: 30, armored: 25, structure: 10, drone: 100, aircraft: 20 }
  autocannon: { infantry: 75, light: 100, armored: 20, structure: 40, drone: 100, aircraft: 40 }
  antiTank: { infantry: 30, light: 100, armored: 100, structure: 60, drone: 40, aircraft: 30 }
  highExplosive: { infantry: 100, light: 80, armored: 60, structure: 100, drone: 60, aircraft: 25 }
  thermobaric: { infantry: 150, light: 70, armored: 20, structure: 120, drone: 60, aircraft: 25 }
  flak: { infantry: 20, light: 25, armored: 10, structure: 5, drone: 150, aircraft: 100 }   # spec 43: anti-air damage, shreds flyers, barely scratches the ground
startingCredits: 5000                # required, >= 0
sellRefundPercent: 50                # optional, 1..100, default 50: Zero Hour building sale refund (spec 37)
lowPowerMinSpeedPercent: 25          # required, 1..100
lowPowerMaxSpeedPercent: 75          # required, 1..100
maxQueue: 9                          # required, 1..9 (semantic check: <= QUEUE_SLOTS)
dockRangeCenti: 100                  # required, >= 1
dockSlots: 2                         # optional, 1..10, default 2: units a supply depot, supply center or repair factory services inside at once; the rest queue outside (spec 55)
crushDodgeLookaheadCenti: 150        # optional, >= 0: tiles*100 past a moving vehicle's nose that enemy soldiers dodge (spec 28 §6); 0 = off
crushDodgeMissOneIn: 3               # optional, >= 0: one half-second window in N a soldier fails to react (spec 28 §6); 0 = always reacts
aimToleranceDeg: 2                   # required, 1..45: default weapon aim tolerance (spec 11 §4.1)
turretRecenterTicks: 30              # required, >= 0: idle ticks before a stationary turret recenters (spec 11 §4.1)
guard: { innerPercent: 180, outerPercent: 220, chaseTicks: 150 }   # optional (spec 49 §3.2): Zero Hour AIData.ini human guard — attack within 180% of sight from the post, chase within 220%, give up after 10 s (150 ticks) outside the inner radius
# Spec 50 §3.3: what each rank gives, regular / veteran / elite / heroic, in percent (Zero Hour GameData.ini
# HealthBonus_* and the VETERAN / ELITE / HERO weapon bonuses). selfHeal: from that rank on (2 = elite) a unit
# gets permille of its maximum hit points back every intervalTicks.
veterancy: { healthPercent: [100, 120, 130, 150], damagePercent: [100, 110, 120, 130], rateOfFirePercent: [100, 120, 140, 160], selfHeal: { fromRank: 2, intervalTicks: 15, permille: 10 } }
# Spec 63: player rank and General's powers. A player earns skill points from the enemies its units destroy (the
# victim's experience value); `ranks` lists the skill points that reach each rank (the first at 0) and the General's
# points each rank grants. Zero Hour's shipped numbers could not be read, so these are tuned for Red Line kill values.
# `powers` is the catalogue: `rank` needed to buy, `cost` in points, `rechargeTicks` between casts; `factions` limits
# who may buy (omitted = all). Effects: scan (explore a disc), repair (heal own vehicles), barrage (blasts on enemy
# ground units), paradrop (units land).
general:
  ranks:
    - { xp: 0, points: 1 }
    - { xp: 300, points: 1 }
    - { xp: 800, points: 1 }
    - { xp: 1600, points: 1 }
    - { xp: 3000, points: 3 }
  powers:
    - { id: recon-scan, rank: 1, cost: 1, rechargeTicks: 900, effect: { kind: scan, radiusCenti: 1500 } }
    - { id: emergency-repair, rank: 2, cost: 1, rechargeTicks: 1800, effect: { kind: repair, radiusCenti: 600, percent: 50 } }
    - { id: artillery-barrage, rank: 3, cost: 2, rechargeTicks: 3600, effect: { kind: barrage, spreadCenti: 400, impacts: 12, damage: 40, splashCenti: 150, damageType: highExplosive } }
    - { id: paradrop-ukraine, rank: 4, cost: 3, rechargeTicks: 3600, factions: [ukraine], effect: { kind: paradrop, unit: ua-rifleman, count: 5 } }
    - { id: paradrop-russia, rank: 4, cost: 3, rechargeTicks: 3600, factions: [russia], effect: { kind: paradrop, unit: ru-rifleman, count: 5 } }
    - { id: paradrop-usa, rank: 4, cost: 3, rechargeTicks: 3600, factions: [usa], effect: { kind: paradrop, unit: us-ranger, count: 5 } }
    # Spec 64: superweapons. `building` grants the power when its first copy is finished (cost 0, never bought); the
    # countdown is the player's, shown to everybody, and low power halts it. Effect: a barrage of heavy blasts.
    - { id: strike-usa, rank: 1, cost: 0, rechargeTicks: 5400, factions: [usa], building: us-strike-battery, effect: { kind: barrage, spreadCenti: 300, impacts: 8, damage: 350, splashCenti: 450, damageType: highExplosive } }
    - { id: strike-russia, rank: 1, cost: 0, rechargeTicks: 5400, factions: [russia], building: ru-oreshnik-launcher, effect: { kind: barrage, spreadCenti: 200, impacts: 5, damage: 600, splashCenti: 600, damageType: thermobaric } }
    - { id: strike-ukraine, rank: 1, cost: 0, rechargeTicks: 5400, factions: [ukraine], building: ua-atacms-battery, effect: { kind: barrage, spreadCenti: 400, impacts: 10, damage: 300, splashCenti: 400, damageType: highExplosive } }
    - { id: strike-china, rank: 1, cost: 0, rechargeTicks: 5400, factions: [china], building: cn-rocket-salvo-park, effect: { kind: barrage, spreadCenti: 600, impacts: 12, damage: 250, splashCenti: 350, damageType: highExplosive } }
    - { id: paradrop-china, rank: 4, cost: 3, rechargeTicks: 3600, factions: [china], effect: { kind: paradrop, unit: cn-rifle-squad, count: 5 } }
locomotors:                          # required, ids referenced by unit types (spec 11 §4.1)
  foot: { kind: foot }
  tracked: { kind: tracks, pivotAngleDeg: 45, accelCenti: 2, brakingCenti: 4, reverseAngleDeg: 120, reverseMaxCenti: 300, reverseSpeedPercent: 50, crusherLevel: 1 }   # crushes enemy infantry (spec 28)
  wheeled: { kind: wheels, minTurnSpeedPercent: 40, slowTurnAngleDeg: 9, accelCenti: 2, brakingCenti: 3, reverseAngleDeg: 120, reverseMaxCenti: 300, reverseSpeedPercent: 40, shoveDamage: 20, shovePushCenti: 40 }   # shoves enemy infantry aside (spec 28)
  # Spec 43 §4.1: flyers ignore the nav grids. `low` flyers are reached by `antiAir: low` weapons, `high` ones by `all` only.
  # Fixed-wing flyers (every flyer without `hover: true`) never drop below minSpeedPercent of their speed and fire inside noseConeDeg of their heading.
  airLow: { kind: air, class: low, altitudeCenti: 140, minSpeedPercent: 60, noseConeDeg: 20 }
  airHigh: { kind: air, class: high, altitudeCenti: 320, minSpeedPercent: 60, noseConeDeg: 20 }
commonTypes:                       # required; type objects with no faction (placeholder, depot)
  - id: tech-slice-placeholder
    category: unit
    armor: infantry
    hp: 1
    sightCenti: 0
    speedCenti: 20
    render: { size: [40, 50, 40] }
  - id: supply-depot
    category: depot
    armor: structure
    footprint: [2, 2]
    render: { height: 60 }
lateTypes:                         # optional; common types listed after the factions so earlier type indices stay (spec 36)
  # Spec 36: a port's cargo yard. It never runs out (owner request; every Zero Hour warehouse empties), but each load
  # makes the truck wait loadTicks more than at a supply depot, so a port pays steadily and slowly.
  - id: port-depot
    category: depot
    armor: structure
    footprint: [3, 2]
    infinite: true
    loadTicks: 90
    render: { height: 60 }
