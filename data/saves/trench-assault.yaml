# Spec 35 §5c: soldiers fight from a trench line. A Ukrainian squad (a Stugna team and two riflemen) holds the covered
# shelter piece at (40, 40): the first two soldiers inside take no damage at all, the third is exposed. A Russian squad
# walks into the far empty end of the same line (the fourth soldier overflows to the next piece), then every second the
# two sides close in piece by piece until they touch and fight with pistols (the RPG gunner and the Stugna team leave
# their launchers out of it). A Russian TOS-1 shells the line: thermobaric blasts wear the trench down and hurt the
# soldiers who are not sheltered, rifles only graze one man at a time.
