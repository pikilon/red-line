# Unit voice sets and fallback categories (specs/25 §5.1, §6.2-6.5).
# Copies Zero Hour's voice parameters for order acknowledgements (UI, owner-only),
# under-fire calls (world positional, owner-only, throttled) and death sounds.

sets:
  ua-rifleman:
    select:    { sounds: [synth:voice], volume: 90, limit: 1, priority: high, type: [ui, voice, player], control: [random, interrupt] }
    move:      { sounds: [synth:voice], volume: 90, limit: 1, priority: high, type: [ui, voice, player], control: [random, interrupt] }
    attack:    { sounds: [synth:voice], volume: 90, limit: 1, priority: high, type: [ui, voice, player], control: [random, interrupt] }
    underFire: { sounds: [synth:voice], volume: 100, minVolume: 80, limit: 1, priority: normal, type: [world, voice, player], control: [random], minDistance: 4, maxDistance: 20 }
    die:       { sounds: [synth:scream], volume: 100, volumeShift: -20, pitchShift: [-10, 10], limit: 3, priority: low, type: [world, voice, player], control: [random], minDistance: 4, maxDistance: 20 }
    created:   { sounds: [synth:voice], volume: 110, minVolume: 100, limit: 1, priority: high, type: [world, global, voice, player], control: [random] }

