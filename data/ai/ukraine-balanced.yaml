  - { taskForce: flamingo, weight: 1, minTick: 3600, once: true }
  - { taskForce: bombers, weight: 1, minTick: 4800, once: true }
  - { taskForce: storm-shadow, weight: 1, minTick: 5400, once: true }
  - { taskForce: robots, weight: 1, minTick: 6000, once: true }
