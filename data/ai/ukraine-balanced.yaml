taskForces:
  - { id: infantry, units: { ua-rifleman: 4, ua-stugna-team: 2 } }
  - { id: mechanized, units: { ua-bradley: 3, ua-rifleman: 4 } }
  - { id: armor, units: { ua-leopard-2a4: 3, ua-bradley: 2 } }
  - { id: fires, units: { ua-himars: 2, ua-leopard-2a4: 2, ua-stugna-team: 3 } }
  - { id: robots, units: { ua-ratel: 3, ua-tw-12-7: 2 } }   # spec 43: ground robots
