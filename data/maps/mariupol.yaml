id: mariupol                         # required, equals the file name
width: 64
height: 56
blocked: []
depots:
  - { origin: [2, 2], amount: 10000 }
  - { origin: [58, 2], amount: 10000 }
# Spec 48 §9: the siege of Mariupol (Mar-May 2022). The Sea of Azov fills the south; the Kalmius river runs down the
# middle of the map into it. West of the river the Azovstal steelworks (the Ukrainian side: big factory and warehouse
# halls on concrete yards, crates, walls). East of it the dense city, where the Russian side starts, with the drama
# theatre square as an open concrete plaza around one large building. The two bases keep the demo-town HQ cells.
terrain:
  ground:
    default: grass
    patches:
      - { material: concrete, rect: [2, 15, 28, 34] }       # Azovstal yards
      - { material: dirt, rect: [2, 35, 28, 44] }
      - { material: sand, rect: [0, 45, 63, 46] }
      - { material: concrete, rect: [40, 24, 52, 33] }      # theatre square
  roads:
    - { type: asphalt, path: [[2, 14], [27, 14]], width: 2 }
    - { type: asphalt, path: [[36, 30], [62, 30]], width: 2 }   # city street east of the Kalmius bridge
    - { type: asphalt, path: [[2, 30], [27, 30]], width: 2 }
    - { type: asphalt, path: [[36, 14], [36, 44]], width: 2 }
    - { type: asphalt, path: [[56, 14], [56, 44]], width: 2 }
    - { type: asphalt, path: [[10, 14], [10, 34]], width: 2 }
    - { type: asphalt, path: [[37, 14], [62, 14]], width: 2 }
  water:
    - { kind: sea, depth: deep, rect: [0, 49, 63, 55] }
    - { kind: sea, depth: shallow, rect: [0, 47, 63, 48] }
    - { kind: river, depth: shallow, path: [[32, 14], [32, 30], [31, 40], [31, 48]], width: 6 }
    - { kind: river, depth: deep, path: [[32, 14], [32, 30], [31, 40], [31, 48]], width: 4 }
features:
  - { type: road-bridge, from: [28, 30], to: [35, 30], variant: 0 }
  # Azovstal: halls, warehouses, crates and walls on the concrete yards.
