id: bakhmut                          # required, equals the file name
width: 128
height: 128
blocked: []
# Spec 48 §9: the battle of Bakhmut (2022-23). The Bakhmutka river runs north to south through the middle of the map
# and splits the town: the old centre (apartment blocks around the Mig-17 monument square, an open concrete plaza) on
# the west bank with the Ukrainian base, a smaller suburb on the east bank. North of the town the AZOM works and the
# winery / salt-mine halls (factories and warehouses on concrete yards) frame the approach. The eastern approach, the
# Russian side, is shell-cratered dirt and mud with breastwork lines (walls, hedges, crates) and tree belts. HQ cells
# and start positions equal first-line, so the Russia 4 save keeps every entity cell.
