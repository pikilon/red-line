# Spec 48 §16 (issue #482): the Black Sea coast near Odesa, April 2022. The open sea fills the north and south,
# a port quarter (quay, cranes, warehouses, containers) sits on the north shore, and a gulf cuts into the
# middle. West: the Ukrainian start among fields and tree belts hiding the Neptune batteries; east: the Russian
# Black Sea Fleet command post (the Moskva stand-in) on a spit between an inlet and the gulf. HQ cells are
# the same as demo-coast, so the save keeps every entity cell.
