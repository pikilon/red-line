id: river-port                       # required, equals the file name
width: 128                           # required, 16..256
height: 96                           # required, 16..256
blocked: []                          # the water, cliffs and features below block cells
# The default skirmish map (spec 32): mirrored left-right. A river runs north to south into the sea and splits
# the two bases; it is crossed by a road bridge (north), a ford (centre), a wooden bridge and a stone arch
# (south). Each side has a harbour on the south coast, a pine forest, two hills, a plateau with a rich depot
# reached by one ramp, river groves and a farm hamlet.
depots:                              # required; origin = top-left cell
  - { origin: [12, 36], amount: 15000 }
  - { origin: [114, 36], amount: 15000 }
  - { origin: [47, 7], amount: 15000 }
  - { origin: [79, 7], amount: 15000 }
  - { origin: [30, 64], amount: 10000 }
  - { origin: [96, 64], amount: 10000 }
elevation:                           # heights in 1/16 tile steps at tile corners (spec 30)
  plateaus:
    - { rect: [44, 4, 51, 11], height: 40, slope: 1.5, rough: 1.5 }
    - { rect: [76, 4, 83, 11], height: 40, slope: 1.5, rough: 1.5 }
  ramps:
    - { from: [47, 11], to: [47, 19], width: 4, height: 40 }
    - { from: [80, 11], to: [80, 19], width: 4, height: 40 }
  hills:
    - { center: [32, 30], radius: 7, height: 24 }
    - { center: [95, 30], radius: 7, height: 24 }
    - { center: [40, 44], radius: 6, height: 18 }
    - { center: [87, 44], radius: 6, height: 18 }
terrain:
  ground:
    default: grass
    patches:
      - { material: dirt, rect: [6, 32, 22, 52] }
      - { material: dirt, rect: [105, 32, 121, 52] }
      - { material: sand, rect: [0, 82, 127, 83] }
      - { material: concrete, rect: [6, 74, 36, 81] }
      - { material: concrete, rect: [91, 74, 121, 81] }
      - { material: mud, rect: [55, 37, 72, 43] }
      - { material: rock, rect: [43, 3, 52, 12] }
      - { material: rock, rect: [75, 3, 84, 12] }
  roads:
    - { type: asphalt, path: [[20, 20], [59, 20]], width: 2 }
    - { type: asphalt, path: [[68, 20], [107, 20]], width: 2 }
    - { type: dirt, path: [[20, 58], [59, 58]], width: 2 }
    - { type: dirt, path: [[68, 58], [107, 58]], width: 2 }
    - { type: asphalt, path: [[20, 72], [59, 72]], width: 2 }
    - { type: asphalt, path: [[68, 72], [107, 72]], width: 2 }
    - { type: asphalt, path: [[20, 20], [20, 72]], width: 2 }
    - { type: asphalt, path: [[107, 20], [107, 72]], width: 2 }
  water:
    - { kind: sea, depth: deep, rect: [0, 86, 127, 95] }
    - { kind: sea, depth: shallow, rect: [0, 84, 127, 85] }
    - { kind: river, depth: shallow, path: [[64, 0], [64, 84]], width: 6 }
    - { kind: river, depth: deep, path: [[64, 0], [64, 84]], width: 4, fords: [[64, 40, 3]] }
