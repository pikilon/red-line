# Spec 48 §10: the Surovikin line on the Zaporizhzhia front (summer 2023, the Robotyne / Tokmak axis). Open steppe of
# wheat and sunflower fields (dirt and sand patches) is cut by poplar windbreaks. The Russian defence lies in layers
# across the middle: sparse minefield strips, an anti-tank ditch (a dirt strip with rubble), two staggered rows of
# dragon's teeth (stone walls with a gap at the road) and strongpoints behind them. The village of Robotyne stands
# in front of the line with its church; the Melitopol road crosses the line on y=64. Same size and HQ cells as first-line.
