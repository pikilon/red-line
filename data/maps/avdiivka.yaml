# Spec 48 §11: the battle of Avdiivka (2023-24). In the north the huge Koksokhim coke plant: factory and warehouse
# halls on a concrete yard crossed by rail sidings (concrete strips), with office towers for the chimneys. East of it
# the ash heaps and spoil tips are hills and a ridge. West and south the town: the Khimik district of apartment blocks
# and the "Tsarskaya Okhota" restaurant strongpoint (shop, fence and walls on a concrete forecourt) near the Zenit
# position. The Russian approach from the east and south is open fields, hedgerows and tree belts. HQ cells and start
# positions equal first-line, so the Russia 6 save keeps every entity cell.
