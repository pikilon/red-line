id: kursk-pipe                       # required, equals the file name
width: 128
height: 128
blocked: []
# Spec 48 §12: Operation "Potok" near Sudzha, Kursk oblast (March 2025). Russian assault troops crawled through the
# disused gas pipeline (a long straight dirt strip along y=64) and emerged behind the Ukrainian lines. The town of
# Sudzha stands in the middle on both sides of the border road, its gas metering station (industrial halls on a concrete
# yard) lies north-east of the town, and the pipeline exits (crate and container stacks) are on the Ukrainian side. The
# fields are still frozen mud and dirt with thin tree belts.
