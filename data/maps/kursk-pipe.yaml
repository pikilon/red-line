      - { material: grass, rect: [88, 100, 126, 126] }
      - { material: rock, rect: [2, 96, 30, 126] }
      - { material: concrete, rect: [84, 42, 100, 54] }       # gas metering station yard
      - { material: sand, rect: [40, 62, 104, 65] }           # the pipeline strip, spoil on both sides
      - { material: concrete, rect: [62, 60, 66, 68] }        # exit pit
