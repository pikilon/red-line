# Spec 48 §15: Kyiv city centre (fictional Russian assault). The wide Dnipro runs north to south through the map
# (shallow banks, deep channel); the right bank (west) holds the Ukrainian base, the government quarter around the
# Maidan (a concrete plaza ringed by towers and halls) and dense apartment blocks; Mariinskyi park stands on the
# river bluff. Three crossings: a Paton-style road bridge (y=42), a rail and road bridge (y=70) and a footbridge
# (y=16). The left bank (east) is residential blocks and open ground around the Russian base. HQ cells and starts
# equal river-port so the Russia 9 save keeps every entity cell; the Ukrainian base is on the right (west) bank
# and the Russian one on the left (east) bank, as in reality.
