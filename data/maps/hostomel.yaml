  - { origin: [12, 54], amount: 15000 }
  - { origin: [114, 72], amount: 15000 }
  - { origin: [26, 34], amount: 10000 }
  - { origin: [98, 26], amount: 10000 }
  - { origin: [30, 100], amount: 10000 }
  - { origin: [112, 116], amount: 10000 }
