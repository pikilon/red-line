id: hostomel                         # required, equals the file name
width: 128
height: 128
blocked: []
# Spec 48 §5: the Antonov Airport at Hostomel. A 100-cell concrete runway runs NW to SE (the real 14/32 strip), a
# parallel taxiway with three connectors feeds the apron on its north-east side, where the hangars, the control tower
# and the terminal stand. The town of Hostomel (houses, shops, a church, apartment blocks) fills the south-east, pine
# woods close the north and south-west. The Ukrainian base stays in the west and the Russian one in the east, as in
# first-line (same HQ cells), so the airfield sits between them.
