id: snake-island                     # required, equals the file name
width: 64
height: 64
blocked: []
# Spec 48 §7 (issue #482): Zmiinyi (Snake Island), the small rocky island of the Black Sea. A low, bare island with
# the lighthouse on its north shore, a pier running out from it, the old radar and garrison buildings in the middle
# and sea all around. West end: the Ukrainian start; east end: the Russian start (same HQ cells as demo-coast, so both
# campaign saves keep their entities). The island is scaled up from its real 0.17 km2 so two bases fit on it.
depots:
  - { origin: [6, 41], amount: 10000 }
  - { origin: [54, 41], amount: 10000 }
terrain:
  ground:
    default: dirt                    # bare rock and scrub
    patches:
      - { material: grass, rect: [14, 24, 48, 40] }
      - { material: sand, rect: [1, 20, 62, 21] }        # north beach
      - { material: sand, rect: [1, 43, 62, 44] }        # south beach
      - { material: concrete, rect: [26, 24, 38, 32] }   # old garrison yard
  water:
    - { kind: sea, depth: deep, rect: [0, 0, 63, 15] }
    - { kind: sea, depth: shallow, rect: [0, 16, 63, 19] }
    - { kind: sea, depth: shallow, rect: [0, 45, 63, 48] }
    - { kind: sea, depth: deep, rect: [0, 49, 63, 63] }
    - { kind: sea, depth: shallow, rect: [0, 20, 0, 44] }
    - { kind: sea, depth: shallow, rect: [63, 20, 63, 44] }
    - { kind: sea, depth: shallow, rect: [1, 20, 4, 21] }    # rounded corners
    - { kind: sea, depth: shallow, rect: [59, 20, 62, 21] }
    - { kind: sea, depth: shallow, rect: [1, 43, 4, 44] }
    - { kind: sea, depth: shallow, rect: [59, 43, 62, 44] }
features:
  # North shore: the lighthouse and the pier running out into the sea.
  - { type: lighthouse, at: [30, 22], variant: 0 }
  - { type: pier, at: [34, 14], rot: 0, variant: 0 }
  - { type: fishing-boat, at: [37, 12], rot: 0, variant: 0 }
  - { type: buoy, at: [26, 12], variant: 0 }
  - { type: buoy, at: [44, 10], variant: 1 }
  - { type: buoy, at: [12, 55], variant: 0 }
  - { type: buoy, at: [50, 54], variant: 1 }
  # The radar post and the garrison buildings in the middle of the island.
  - { type: factory, at: [30, 26], rot: 0, variant: 0 }
  - { type: warehouse-barn, at: [24, 30], rot: 0, variant: 0 }
  - { type: warehouse-barn, at: [38, 30], rot: 0, variant: 1 }
  - { type: house-small, at: [34, 27], rot: 1, variant: 0 }
  - { type: house-small, at: [26, 36], rot: 0, variant: 1 }
  - { type: shop, at: [36, 36], rot: 0, variant: 2 }
  - { type: lamp-post, at: [28, 34], rot: 0, variant: 0 }
  - { type: lamp-post, at: [34, 34], rot: 0, variant: 0 }
  - { type: crate-stack, at: [22, 34], rot: 0, variant: 0 }
  - { type: crate-stack, at: [41, 34], rot: 1, variant: 1 }
  - { type: stone-wall, at: [23, 26], rot: 0, variant: 0 }
  # Scrub and a few dead trees.
  - { type: bush, area: [4, 22, 20, 24], density: 25, seed: 3 }
  - { type: bush, area: [44, 41, 60, 43], density: 25, seed: 5 }
  - { type: dead-tree, area: [18, 38, 24, 42], density: 12, seed: 7 }
  - { type: dead-tree, area: [42, 22, 48, 25], density: 12, seed: 9 }
