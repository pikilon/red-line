# Spec 31 section 6: height and cover in combat. All values are percentages or whole tiles.
highGround: { minTiles: 2, rangePct: 115 }   # shooter >= minTiles above the target reaches rangePct percent of its range
cover:                                       # pct = damage the target avoids; the best cover applies, never the sum (A3)
  crater: { pct: 30 }                        # spec 60: craters are terrain now, but shelter is still not applied
  trench: { pct: 50 }                        # spec 35: infantry standing in a finished trench (no Zero Hour precedent)
  forest: { pct: 25 }                        # target on or beside a living tree or hedge (stumps and bushes give none)
  wall:   { pct: 40, blocksShots: false }    # the shot crosses a wall or building footprint; reduces, does not stop (spec 31 section 9, question 2)
# Spec 35: repair works. Zero Hour's dozer heals 2% of max health per second alone (RepairHealthPercentPerSecond);
# here workers add up (owner request): each worker brings its work points, up to maxWorkers workers per job.
repair:
  permillePerSecondPerPoint: 7   # max hp permille one work point restores per second (dozer 3 points = 2.1%/s)
  infantryPoints: 1
  dozerPoints: 3
  maxWorkers: 6
  vehicleRepairTicks: 75   # spec 39: five seconds at 15 Hz, Zero Hour TimeForFullHeal = 5000 ms
  costPermille: 500        # spec 38: repairing units and buildings costs 50% of the build price, pro rata to hp restored
# Spec 40: damaged infantry heal inside an own barracks (Zero Hour HealContain).
infirmary:
  healTicks: 30   # 2000 ms at 15 Hz
  slots: 2        # spec 55: two patients inside at once (owner request); the rest wait outside
# Spec 60: craters as simulation terrain. Depths and radii are centi-tiles; stacked craters add up to maxDepthCenti.
craters:
  maxDepthCenti: 50          # spec 24 section 3.1: a crater field never sinks more than half a tile
  digs:                      # what a shell that lands on open ground digs, by damage type (matches data/render/impacts.json)
    antiTank:      { radiusCenti: 65,  depthCenti: 4 }
    highExplosive: { radiusCenti: 130, depthCenti: 12 }
    thermobaric:   { radiusCenti: 220, depthCenti: 4 }
  movers:                    # slowPct: speed lost at maxDepthCenti, linear with depth; blockDepthCenti: the cell closes at this depth
    foot:   { slowPct: 0 }
    tracks: { slowPct: 35 }
    wheels: { slowPct: 55, blockDepthCenti: 20 }
